<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <title>AR.js Hello World</title>

  <!-- カメラ制約の調整：スマホは背面カメラを「希望」（ideal なので無くても失敗しない）、
       PC は使えるカメラ（前面）をそのまま使う。AR.js より前に読み込むこと -->
  <script>
    (function () {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
      var orig = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
      var isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent || '');
      navigator.mediaDevices.getUserMedia = function (c) {
        if (c && typeof c.video === 'object') c = Object.assign({}, c, { video: isMobile ? { facingMode: { ideal: 'environment' } } : true });
        return orig(c);
      };
    })();
  </script>

  <!-- A-Frame（3D/WebXR フレームワーク） -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <!-- AR.js（A-Frame 版）。確認用の表示（?preview=1）では読み込まない（読み込むと自動でカメラを使い始めるため） -->
  <script>
    if (!new URLSearchParams(location.search).has('preview'))
      document.write('<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"><\/script>');
  </script>

  <style>
    body { margin: 0; overflow: hidden; }
    /* 使い方の簡単な説明バー */
    .hint {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 999;
      background: rgba(31, 58, 95, 0.85); /* ネイビー */
      color: #fff; font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      font-size: 14px; text-align: center; padding: 8px 10px; line-height: 1.6;
    }
    .hint a { color: #FFD9A0; }
  </style>
</head>
<body>
  <div class="hint">
    「AR.js」マーカーをカメラに写すと <b>Hello World</b> が表示されます。<br>
    <a href="marker-arjs.png" target="_blank">マーカー画像</a>（白い余白ごと表示・印刷）／
    <a href="?preview=1">カメラなしで確かめる</a>／
    <a href="task9/">発展版：古典の身なり AR</a>
  </div>

  <script>
    const preview = new URLSearchParams(location.search).has('preview');

    // マーカーの上に出すもの：寝かせた "Hello World" と、下に敷く白い板
    const content = `
      <a-text value="Hello World" align="center" color="#1F3A5F" width="4" position="0 0.1 0" rotation="-90 0 0"></a-text>
      <a-plane position="0 0 0" rotation="-90 0 0" width="2.2" height="1.2" color="#FFFFFF" opacity="0.75"></a-plane>`;

    const scene = document.createElement('a-scene');
    scene.setAttribute('vr-mode-ui', 'enabled: false');
    if (preview) {
      // 確認用：マーカーの代わりに、机の上に置いたものを斜め上から見る
      scene.innerHTML = `
        <a-sky color="#cfd6dc"></a-sky>
        <a-entity>${content}</a-entity>
        <a-entity camera look-controls="enabled: false" position="0 2.2 1.6" rotation="-52 0 0"></a-entity>`;
    } else {
      // embedded: ページ内に埋め込み表示 / arjs: AR.js を有効化
      scene.setAttribute('embedded', '');
      scene.setAttribute('arjs', 'sourceType: webcam; debugUIEnabled: false; detectionMode: mono;');
      // 「AR.js」マーカー（marker-arjs.png から作った marker-arjs.patt）を認識する。smooth で揺れを抑える
      scene.innerHTML = `
        <a-marker type="pattern" url="marker-arjs.patt" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">${content}</a-marker>
        <a-entity camera></a-entity>`;
    }
    document.body.appendChild(scene);
  </script>
</body>
</html>
