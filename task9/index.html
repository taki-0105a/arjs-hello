<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <title>平安の装束AR（タスク9-1）</title>
  <script>
    // スマホでは背面カメラを希望する（ideal なので、無くても失敗しない）。AR.js より前に置く
    (function () {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
      var orig = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
      var isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent || '');
      navigator.mediaDevices.getUserMedia = function (c) {
        if (c && typeof c.video === 'object') c = Object.assign({}, c, { video: isMobile ? { facingMode: { ideal: 'environment' } } : true });
        return orig(c);
      };
    })();
  </script>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script>
    // 確認用の表示（?preview=1）では AR.js を読み込まない（読み込むと自動でカメラを使い始めるため）
    if (!new URLSearchParams(location.search).has('preview'))
      document.write('<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"><\/script>');
  </script>
  <script src="heian.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; }
    #info { position: fixed; left: 8px; right: 8px; top: 8px; z-index: 999; background: rgba(20, 22, 28, 0.78); color: #fff;
            border-radius: 10px; padding: 8px 12px; font-size: 14px; line-height: 1.6; }
    #info b { font-size: 16px; }
    #bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 999; padding: 8px; background: rgba(20, 22, 28, 0.78);
           display: flex; flex-direction: column; gap: 6px; }
    .row { display: flex; gap: 6px; overflow-x: auto; }
    button { flex: 0 0 auto; border: 1px solid #8a7a5a; background: #2b2a26; color: #f1ead8; border-radius: 16px;
             padding: 7px 12px; font-size: 14px; font-family: inherit; }
    button.on { background: #c9a96a; color: #1d1a14; border-color: #c9a96a; font-weight: bold; }
    #ranks { display: none; }
    #hint { position: fixed; left: 0; right: 0; top: 45%; text-align: center; color: #fff; text-shadow: 0 0 6px #000; z-index: 998; font-size: 15px; }
  </style>
</head>
<body>
  <div id="info"></div>
  <div id="hint">「平」のマーカーにカメラを向けてください</div>
  <div id="bar">
    <div class="row" id="ranks"></div>
    <div class="row" id="kinds"></div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const preview = params.has('preview');   // ?preview=1：カメラなしで中身を確かめる表示
    const H = window.HEIAN;

    // 出すものの一覧（説明と色は heian.js の INFO / PALETTE を使う）
    const KINDS = [
      { id: 'shinden', label: '寝殿造', scale: 0.55, make: () => H.shinden() },
      { id: 'sokutai', label: '束帯（男性の正装）', scale: 0.8, make: () => H.sokutai(H.PALETTE.hoRank[currentRank]) },
      { id: 'nyobo', label: '女房装束', scale: 0.9, make: () => H.seatedLady(H.PALETTE.nyobo, { karaginu: true, mo: true, ogi: true }) },
      { id: 'kouchiki', label: '小袿', scale: 0.9, make: () => H.seatedLady(H.PALETTE.kouchiki, { kouchiki: true, ogi: true }) },
    ];
    let current = 'sokutai', currentRank = Object.keys(H.PALETTE.hoRank)[0];

    function buildScene() {
      const scene = document.createElement('a-scene');
      if (!preview) scene.setAttribute('embedded', '');
      scene.setAttribute('vr-mode-ui', 'enabled: false');
      scene.setAttribute('renderer', 'colorManagement: true; antialias: true');
      if (!preview) scene.setAttribute('arjs', 'sourceType: webcam; debugUIEnabled: false; detectionMode: mono;');
      scene.innerHTML = `
        <a-entity light="type: ambient; intensity: 0.65"></a-entity>
        <a-entity light="type: directional; intensity: 0.9" position="1 3 2"></a-entity>`;
      const anchor = document.createElement(preview ? 'a-entity' : 'a-marker');
      if (!preview) { anchor.setAttribute('type', 'pattern'); anchor.setAttribute('url', 'marker-heian.patt');
        anchor.setAttribute('smooth', 'true'); anchor.setAttribute('smoothCount', '10'); anchor.setAttribute('smoothTolerance', '0.01'); anchor.setAttribute('smoothThreshold', '5'); }
      const stage = document.createElement('a-entity'); stage.setAttribute('heian-stage', ''); stage.id = 'stage';
      anchor.appendChild(stage); scene.appendChild(anchor);
      if (preview) {
        scene.insertAdjacentHTML('beforeend', '<a-sky color="#cfd6dc"></a-sky><a-plane rotation="-90 0 0" width="6" height="6" color="#9a9384"></a-plane>' +
          '<a-entity camera look-controls="enabled: false" position="0 0.75 1.55" rotation="-14 0 0"></a-entity>');
        document.getElementById('hint').style.display = 'none';
        // ドラッグで回す
        let dragging = false, lastX = 0;
        addEventListener('pointerdown', e => { if (e.target.tagName === 'CANVAS') { dragging = true; lastX = e.clientX; } });
        addEventListener('pointerup', () => dragging = false);
        addEventListener('pointermove', e => { if (!dragging) return; const s = stage.components['heian-stage']; s.holder.rotation.y += (e.clientX - lastX) * 0.01; lastX = e.clientX; });
      } else {
        scene.insertAdjacentHTML('beforeend', '<a-entity camera></a-entity>');
        anchor.addEventListener('markerFound', () => document.getElementById('hint').style.display = 'none');
        anchor.addEventListener('markerLost', () => document.getElementById('hint').style.display = 'block');
      }
      document.body.appendChild(scene);
      if (!preview) applyStand();
      scene.addEventListener('loaded', () => render());
    }

    // 画面に出したマーカー（縦）：人物を画面に沿って立て、足元をマーカーの下の辺に置く
    // 机に置いたマーカー（横）：マーカーの上に立てる
    let stand = true;
    function applyStand() {
      const st = document.getElementById('stage');
      st.setAttribute('rotation', stand ? '-90 0 0' : '0 0 0');
      st.setAttribute('position', stand ? '0 0 0.5' : '0 0 0');
    }

    function render() {
      const k = KINDS.find(x => x.id === current);
      const stage = document.getElementById('stage').components['heian-stage'];
      stage.show(k.make(), k.scale);
      const key = current === 'sokutai' ? 'sokutai:' + currentRank : current;
      document.getElementById('info').innerHTML = H.INFO[key] || `<b>${k.label}</b>`;
      document.getElementById('ranks').style.display = current === 'sokutai' ? 'flex' : 'none';
      const rb = document.getElementById('roofBtn'); if (rb) { rb.style.display = current === 'shinden' ? '' : 'none'; rb.classList.remove('on'); }
      document.querySelectorAll('#kinds button').forEach(b => b.classList.toggle('on', b.dataset.id === current));
      document.querySelectorAll('#ranks button').forEach(b => b.classList.toggle('on', b.dataset.id === currentRank));
    }

    // ボタン
    const kinds = document.getElementById('kinds'), ranks = document.getElementById('ranks');
    KINDS.forEach(k => { const b = document.createElement('button'); b.textContent = k.label; b.dataset.id = k.id; b.onclick = () => { current = k.id; render(); }; kinds.appendChild(b); });
    Object.keys(H.PALETTE.hoRank).forEach(r => { const b = document.createElement('button'); b.textContent = r; b.dataset.id = r; b.onclick = () => { currentRank = r; render(); }; ranks.appendChild(b); });
    const spin = document.createElement('button'); spin.textContent = '回す'; spin.onclick = () => { const s = document.getElementById('stage').components['heian-stage']; s.spin = !s.spin; spin.classList.toggle('on', s.spin); };
    kinds.appendChild(spin);
    // 寝殿造のときだけ：屋根を外して間取りを見る
    const roofBtn = document.createElement('button'); roofBtn.textContent = '屋根を外す'; roofBtn.id = 'roofBtn';
    roofBtn.onclick = () => { const s = document.getElementById('stage').components['heian-stage']; const y = s.holder.getObjectByName('yane'); if (y) { y.visible = !y.visible; roofBtn.classList.toggle('on', !y.visible); } };
    kinds.appendChild(roofBtn);
    if (!preview) {
      const standBtn = document.createElement('button'); standBtn.textContent = '向き：画面のマーカー';
      standBtn.onclick = () => { stand = !stand; applyStand(); standBtn.textContent = stand ? '向き：画面のマーカー' : '向き：机のマーカー'; };
      kinds.appendChild(standBtn);
    }
    buildScene();
  </script>
</body>
</html>
