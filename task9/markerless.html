<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>平安の装束AR（マーカーなし）</title>
  <!-- 模型は heian.js で組み立てる（A-Frame は three.js を使うためだけに読み込む。シーンは作らない） -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script>window.THREE = AFRAME.THREE;</script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.137.0/examples/js/exporters/GLTFExporter.js"></script>
  <script src="heian.js"></script>
  <!-- 平面を見つけて置く：iPhone は AR クイックルック、Android は WebXR -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #e9e4d8; font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; }
    model-viewer { position: fixed; inset: 0; width: 100%; height: 100%; --poster-color: transparent; }
    #info { position: fixed; left: 8px; right: 8px; top: 8px; z-index: 10; background: rgba(20, 22, 28, 0.78); color: #fff;
            border-radius: 10px; padding: 8px 12px; font-size: 14px; line-height: 1.6; }
    #info b { font-size: 16px; }
    #bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; padding: 8px; background: rgba(20, 22, 28, 0.78);
           display: flex; flex-direction: column; gap: 6px; }
    .row { display: flex; gap: 6px; overflow-x: auto; }
    button { flex: 0 0 auto; border: 1px solid #8a7a5a; background: #2b2a26; color: #f1ead8; border-radius: 16px;
             padding: 7px 12px; font-size: 14px; font-family: inherit; }
    button.on { background: #c9a96a; color: #1d1a14; border-color: #c9a96a; font-weight: bold; }
    #ranks { display: none; }
    #arBtn { position: absolute; left: 50%; transform: translateX(-50%); bottom: 120px; background: #c9a96a; color: #1d1a14;
             border: none; font-weight: bold; font-size: 16px; padding: 12px 20px; border-radius: 24px; }
    #noAr { position: absolute; left: 12px; right: 12px; bottom: 120px; text-align: center; color: #3a3328; font-size: 13px; }
  </style>
</head>
<body>
  <model-viewer id="mv" ar ar-modes="webxr quick-look" ar-placement="floor" ar-scale="auto"
                camera-controls touch-action="pan-y" shadow-intensity="1" exposure="1.05"
                camera-orbit="20deg 75deg auto" interaction-prompt="none" alt="平安の寝殿造と装束の模型">
    <button slot="ar-button" id="arBtn">机に置いて見る（AR）</button>
    <div id="noAr" slot="ar-failure"></div>
  </model-viewer>
  <div id="info"></div>
  <div id="bar">
    <div class="row" id="ranks"></div>
    <div class="row" id="kinds"></div>
  </div>
  <script>
    const H = window.HEIAN;
    const mv = document.getElementById('mv');

    // 出すもの。size は AR で置いたときの大きさ（メートル）の目安。置いたあと、つまんで変えられる
    const KINDS = [
      { id: 'shinden', label: '寝殿造', size: 0.5, make: () => H.shinden() },
      { id: 'sokutai', label: '束帯（男性の正装）', size: 0.3, make: () => H.sokutai(H.PALETTE.hoRank[currentRank]) },
      { id: 'nyobo', label: '女房装束', size: 0.25, make: () => H.seatedLady(H.PALETTE.nyobo, { karaginu: true, mo: true, ogi: true }) },
      { id: 'kouchiki', label: '小袿', size: 0.25, make: () => H.seatedLady(H.PALETTE.kouchiki, { kouchiki: true, ogi: true }) },
    ];
    let current = 'sokutai', currentRank = Object.keys(H.PALETTE.hoRank)[0], roofOff = false, lastUrl = null;

    // heian.js の模型を GLB にして model-viewer に渡す
    function toGlb(obj, size) {
      obj.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(obj), dim = new THREE.Vector3(); box.getSize(dim);
      const s = size / Math.max(dim.x, dim.y, dim.z);
      const root = new THREE.Group(); obj.scale.multiplyScalar(s); root.add(obj);
      // 色は sRGB の値で書いてあるので、glTF の決まり（リニア）に直す
      root.traverse(o => { if (o.material && o.material.color && !o.material.userData.lin) { o.material.color.convertSRGBToLinear(); o.material.userData.lin = true; } });
      return new Promise(res => new THREE.GLTFExporter().parse(root, buf => res(buf), { binary: true, onlyVisible: true }));
    }

    async function render() {
      const k = KINDS.find(x => x.id === current);
      const obj = k.make();
      if (current === 'shinden' && roofOff) { const y = obj.getObjectByName('yane'); if (y) y.visible = false; }
      const buf = await toGlb(obj, k.size);
      if (lastUrl) URL.revokeObjectURL(lastUrl);
      lastUrl = URL.createObjectURL(new Blob([buf], { type: 'model/gltf-binary' }));
      mv.src = lastUrl;
      const key = current === 'sokutai' ? 'sokutai:' + currentRank : current;
      document.getElementById('info').innerHTML = H.INFO[key] || `<b>${k.label}</b>`;
      document.getElementById('ranks').style.display = current === 'sokutai' ? 'flex' : 'none';
      roofBtn.style.display = current === 'shinden' ? '' : 'none';
      roofBtn.classList.toggle('on', roofOff);
      document.querySelectorAll('#kinds button[data-id]').forEach(b => b.classList.toggle('on', b.dataset.id === current));
      document.querySelectorAll('#ranks button').forEach(b => b.classList.toggle('on', b.dataset.id === currentRank));
    }

    const kinds = document.getElementById('kinds'), ranks = document.getElementById('ranks');
    KINDS.forEach(k => { const b = document.createElement('button'); b.textContent = k.label; b.dataset.id = k.id; b.onclick = () => { current = k.id; render(); }; kinds.appendChild(b); });
    Object.keys(H.PALETTE.hoRank).forEach(r => { const b = document.createElement('button'); b.textContent = r; b.dataset.id = r; b.onclick = () => { currentRank = r; render(); }; ranks.appendChild(b); });
    const spin = document.createElement('button'); spin.textContent = '回す';
    spin.onclick = () => { const on = !mv.hasAttribute('auto-rotate'); on ? mv.setAttribute('auto-rotate', '') : mv.removeAttribute('auto-rotate'); spin.classList.toggle('on', on); };
    kinds.appendChild(spin);
    const roofBtn = document.createElement('button'); roofBtn.textContent = '屋根を外す';
    roofBtn.onclick = () => { roofOff = !roofOff; render(); };
    kinds.appendChild(roofBtn);

    // AR が使えない端末（パソコンなど）では、その旨を出す
    mv.addEventListener('load', () => {
      document.getElementById('noAr').textContent = mv.canActivateAR ? '' : 'この端末では AR を使えません。指でドラッグすると回せます。';
    });
    render();
  </script>
</body>
</html>
